# 只使用 stable rustfmt 支持的选项。
# nightly-only 选项（imports_granularity、group_imports、wrap_comments、
# error_on_line_overflow、error_on_unformatted 等）在 stable 上不会生效。
edition = "2021"
style_edition = "2021"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
merge_derives = true
remove_nested_parens = true
use_try_shorthand = true
use_field_init_shorthand = true
force_explicit_abi = true
