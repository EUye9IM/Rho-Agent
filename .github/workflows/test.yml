name: test

on:
  push:
    branches: [master, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-stable-
            ${{ runner.os }}-cargo-test-

      - name: Build
        run: cargo build --all-targets --locked

      - name: Run tests
        run: cargo test --all-targets --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  build:
    name: build (x86_64-musl)
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
    needs: [test, clippy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          rustc --version
          cargo --version

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          musl-gcc --version

      - name: Build release
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CFLAGS_x86_64_unknown_linux_musl: "-march=x86-64 -mtune=generic"
          CXXFLAGS_x86_64_unknown_linux_musl: "-march=x86-64 -mtune=generic"
          RUSTFLAGS: "-C target-cpu=x86-64"
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          ls -lh target/x86_64-unknown-linux-musl/release/rho
          file target/x86_64-unknown-linux-musl/release/rho

      - name: Package
        run: |
          set -eu
          target=x86_64-unknown-linux-musl
          mkdir -p dist
          tar -C target/$target/release -czf dist/rho-$target.tar.gz rho
          cd dist
          sha256sum rho-$target.tar.gz > rho-$target.tar.gz.sha256
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rho-x86_64-unknown-linux-musl
          path: |
            dist/rho-x86_64-unknown-linux-musl.tar.gz
            dist/rho-x86_64-unknown-linux-musl.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling nightly
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=nightly
          asset=rho-x86_64-unknown-linux-musl.tar.gz
          checksum=${asset}.sha256

          # 让 nightly tag 始终指向最新 master commit。
          git tag -f "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/$asset" "dist/$checksum" --clobber
            gh release edit "$tag" \
              --title "Nightly" \
              --notes "Rolling nightly build from ${GITHUB_SHA:0:7}"
          else
            gh release create "$tag" "dist/$asset" "dist/$checksum" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Nightly" \
              --notes "Rolling nightly build from ${GITHUB_SHA:0:7}"
          fi

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          asset=rho-x86_64-unknown-linux-musl.tar.gz
          checksum=${asset}.sha256

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/$asset" "dist/$checksum" --clobber
            gh release edit "$tag" \
              --title "$tag" \
              --notes "Release $tag"
          else
            gh release create "$tag" "dist/$asset" "dist/$checksum" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes
          fi
