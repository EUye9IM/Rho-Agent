name: Feature request / 功能建议
description: Suggest an idea for rho / 提出一个功能愿望或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **中文**：先描述问题和场景，不要直接跳到实现。这个 issue 先作为愿望收集；确认进入某个版本后，才会被加入 `docs/features.md`。

        **English**: Start with the problem and the scenario, not the implementation. This issue is a wish-list item first; it enters `docs/features.md` only after it is accepted for a version.

  - type: textarea
    id: problem
    attributes:
      label: 用户问题 / Problem
      description: |
        中文：现在哪里不方便？谁在什么场景下遇到？

        English: What is inconvenient today? Who runs into it, and in what scenario?
      placeholder: |
        中文：在目标机上排查网络时，需要反复手输完整命令……

        English: When debugging networking on the target box, I have to retype the full command...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望行为 / Proposed behavior
      description: |
        中文：你希望 rho 表现成什么样？描述用户可见结果，不必先定实现。

        English: What should rho do? Describe the user-visible result; implementation is not required yet.
      placeholder: |
        中文：`rho --config x.toml` 时，如果配置里的模型不存在，启动前直接指出具体行号……

        English: With `rho --config x.toml`, if a model in the config does not exist, report the exact line before startup...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件 / Acceptance criteria
      description: |
        中文：怎样算完成？尽量写成可验证的条目。

        English: What counts as done? Prefer verifiable checklist items.
      placeholder: |
        - [ ] 中文验收项 / English acceptance item
        - [ ] 中文验收项 / English acceptance item
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 边界与非目标 / Scope and non-goals
      description: |
        中文：这次明确不做什么？避免范围悄悄扩大。

        English: What is explicitly out of scope? Prevent scope creep.
      placeholder: |
        中文：只支持 OpenAI Chat Completions；不改 bash 工具；不引入新依赖。

        English: Only OpenAI Chat Completions; do not change the bash tool; no new dependencies.

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives considered
      description: |
        中文：你考虑过哪些替代方案？为什么不够好？

        English: What alternatives did you consider, and why are they insufficient?
      placeholder: |
        中文：可以手写包装脚本，但每个目标机都要维护一份……

        English: A wrapper script would work, but it has to be maintained on every target box...

  - type: dropdown
    id: area
    attributes:
      label: 影响范围 / Area
      multiple: true
      options:
        - CLI / REPL
        - Config / 配置
        - Provider / 协议
        - bash tool / 安全
        - Rendering / 终端
        - Build / 发布
        - Docs / 文档
        - Unsure / 不确定

  - type: dropdown
    id: release
    attributes:
      label: 版本意向 / Release intent
      description: |
        中文：只是意向，不代表已经排期。

        English: This is intent only; it does not mean the feature is scheduled.
      options:
        - Backlog / 未排期（候选）
        - Next minor / 下一个 minor
        - Next patch / 下一个 patch
        - Not sure / 不确定
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: 影响检查 / Impact checklist
      description: |
        中文：勾选所有适用项。

        English: Check all that apply.
      options:
        - label: 改变用户可见行为或配置语义（需要先更新 docs/design.md） / Changes user-visible behavior or config semantics (update docs/design.md first)
        - label: 可能增加依赖、体积或常驻内存 / May add dependencies, binary size, or RSS
        - label: 涉及 bash 工具、权限或安全模型 / Touches the bash tool, permissions, or security model
        - label: 需要新增测试或手工终端验收 / Needs new tests or manual terminal validation

  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: |
        中文：链接、截图、类似工具的做法等。

        English: Links, screenshots, prior art, etc.
