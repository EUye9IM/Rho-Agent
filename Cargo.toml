[package]
name = "rho"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Lightweight local agent REPL for resource-constrained devices"
license = "MIT"

[[bin]]
name = "rho"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
rustyline = "14"
libc = "0.2"

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
