[package]
name = "rho"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Lightweight local agent REPL for resource-constrained devices"
license = "MIT"

[lib]
name = "rho"
path = "src/lib.rs"

[[bin]]
name = "rho"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
indexmap = { version = "2.7", features = ["serde"] }
ureq = { version = "2.10", default-features = false, features = ["tls"] }
rustyline = { version = "14", default-features = false }
libc = "0.2"

[dev-dependencies]
indexmap = { version = "2.7", features = ["serde"] }

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
